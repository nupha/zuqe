[package]
name = "zuqe"
version = "0.3.0"
edition = "2024"
description = "Zuqe JS Engine - A lightweight JS engine implemented in Rust, designed for embedded systems and general‑purpose use."
build = "build.rs"
readme = "README.md"
authors = ["John Ray <996351336@qq.com>"]
repository = "https://github.com/nupha/zuqe"
license = "Apache-2.0"

[features]
all_unicode = ["unicode-xid", "unicode-normalization"]
builtin_json = []
dump_bytecode = []

default = ["all_unicode", "builtin_json"]

[profile.release]
overflow-checks = false
debug = false
opt-level = 3
lto = "fat"
panic = "abort"
strip = "symbols"
codegen-units = 1

[profile.release.package."*"]
overflow-checks = false
debug = false
opt-level = 3
strip = "symbols"

# for flamegraph
[profile.release-with-debug]
inherits = "release"
debug = true
strip = false
[profile.release-with-debug.package."*"]
debug = true
strip = false

[dependencies]
paste = "1.0"
bitflags = "2.0"
once_cell = "1.21"
hash-link = "0.1"
smallvec = "1.13"
fallible_collections = "0.5"
gc-lite = "0.3"
lre = "0.1"
unicode-xid = { version = "0.2", optional = true }
unicode-normalization = { version = "0.1", optional = true }
zerocopy = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
cc = "1.0"
once_cell = "1.21"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
glob = "0.3"
colorized = "1.0"
log = "0.4"
libc = "0.2"
env_logger = { version = "0.9", default-features = false }
anyhow = { version = "1", default-features = false }


[lib]
lib = "src/lib.rs"

[[example]]
name = "zjs"
path = "examples/zjs/main.rs"

[[example]]
name = "test262"
path = "examples/test262.rs"
