[package]
name = "zhuque"
version = "0.0.0"
edition = "2024"
description = "A simple javascript engine"
authors = ["johnray <996351336@qq.com>"]
build = "build.rs"

[features]
string_intern = []
nan_boxing = []
short_opcode = []
all_unicode = []
atomics = []
dump_objects = []
dump_atoms = []
dump_shapes = []
dump_leaks = []
dump_free = []
dump_bytecode = []
dump_gc_free = []

default = [
    "string_intern",
    "all_unicode",
    "atomics",
    "dump_leaks",
    "dump_objects",
    #"dump_shapes",
    "dump_bytecode",
    #"dump_free",
    #"dump_gc_free",
]

[profile.release]
overflow-checks = false
debug = false
opt-level = 3
lto = "fat"
panic = "abort"
strip = "symbols"
codegen-units = 1

[profile.release.package."*"]
overflow-checks = false
debug = false
opt-level = 3
strip = "symbols"

[dependencies]
paste = "1.0"
libc = "0.2"
lazy_static = "1.5"
indexmap = "2.7"
smallvec = "1.13"
widestring = "1.1"
fallible_collections = "0.5"
unicode-xid = "0.2"
unicode-normalization = "0.1"
regex = { version = "1.11", default-features = false, features = [
    "std",
    "unicode-case",
] }

[build-dependencies]
cc = "1.0"
once_cell = "1.19"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
glob = "0.3"
colorized = "1.0"
log = "0.4"
env_logger = { version = "0.9", default-features = false }
anyhow = { version = "1", default-features = false }


[lib]
lib = "src/lib.rs"

# [examples]
# eval = "examples/eval.rs"
