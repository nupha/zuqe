[package]
name = "zhuque"
version = "0.0.0"
edition = "2024"
description = "A simple javascript engine"
authors = ["johnray <996351336@qq.com>"]
build = "build.rs"

[features]
nan_boxing = []
short_opcode = []
all_unicode = []
atomics = []
dump_objects = []
dump_atoms = []
dump_shapes = []
dump_leaks = []
dump_free = []
dump_bytecode = []
dump_gc_free = []

default = [
    "atomics",
    "dump_leaks",
    "dump_objects",
    #"dump_shapes",
    "dump_bytecode",
    #"dump_free",
    #"dump_gc_free",
]

[dependencies]
log = "0.4"
env_logger = "0.9"
anyhow = { version = "1", default-features = false }
libc = "0.2"
lazy_static = "1.5"
libunwind = "1.3"
indexmap = "2.7"
smallvec = "1.13"
widestring = "1.1"
unicode-case-mapping = "1.0.0"
fallible_collections = "0.5"
unicode-xid = "0.2"
unicode-normalization = "0.1"
# TODO: could use fancy_regex for complex regexp support?
regex = "1.0"

[build-dependencies]
cc = "1.0"
once_cell = "1.19"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
glob = "0.3"
colorized = "1.0"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release.package."*"]
opt-level = "s"
strip = "symbols"

[lib]
lib = "src/lib.rs"

# [examples]
# eval = "examples/eval.rs"
