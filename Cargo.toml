[package]
name = "zuqe"
version = "0.9.1"
edition = "2024"
description = "Zuqe JS Engine - A lightweight JS engine implemented in Rust, designed for embedded systems and general‑purpose use."
build = "build.rs"
readme = "README.md"
authors = ["John Ray <996351336@qq.com>"]
repository = "https://github.com/nupha/zuqe"
license = "Apache-2.0"

[features]
inline_cache = []
big_int = []
all_unicode = ["unicode-id-start", "unicode-normalization"]
async_support = ["futures-util"]
crossbeam_channel = ["crossbeam"]
serde_json_support = ["serde_json"]
zapi = ["zuqe_zapi", "libloading"]
quantum_poll = []
persistent = []

builtin_proxy = []
builtin_atomic = []
builtin_mapset = []
builtin_regexp = ["lre"]
builtin_reflect = []
builtin_json = []
builtin_date = []
builtin_math = []
builtin_weakref = []
intl402 = ["dep:icu", "dep:fixed_decimal"]

dump_bytecode = []
debug_gc = []


# Protect temporarily dangling GC objects taken out of traced locations before
# they are re-anchored. Enable only when gc_alloc may trigger collect (arena
# full, etc.). If gc_alloc never triggers collect (almost the standard behavior),
# this feature should NOT be enabled.
#
# You almost never need this.
gc_protect_transient = []

default = [
    "inline_cache",
    "big_int",
    "all_unicode",
    "async_support",

    "builtin_mapset",
    "builtin_proxy",
    "builtin_atomic",
    "builtin_regexp",
    "builtin_reflect",
    "builtin_json",
    "builtin_date",
    "builtin_math",
    "builtin_weakref",

    "intl402",
]

[profile.release]
panic = "abort"
overflow-checks = false
debug = false
opt-level = 3
lto = "fat"
strip = "symbols"
codegen-units = 1

[profile.release.package."*"]
overflow-checks = false
debug = false
opt-level = 3
strip = "symbols"

# for flamegraph
[profile.release-with-debug]
inherits = "release"
panic = "unwind"
debug = true
strip = false
[profile.release-with-debug.package."*"]
debug = true
strip = false

[dependencies]
paste = "1.0"
bitflags = "2.0"
hash-link = "0.1"
smallvec = "1.13"
fallible_collections = "0.5"
gc-lite = { path = "../gc-lite-v2" }
lre = { version = "0.3.1", optional = true }
icu = { version = "2.3.0", optional = true }
fixed_decimal = { version = "0.7.2", optional = true }
libc = "0.2"
unicode-id-start = { version = "1.4", optional = true }
unicode-normalization = { version = "0.1", optional = true }
zerocopy = "0.8"
url = "2.5"
log = "0.4"
futures-util = { version = "0.3", optional = true }
crossbeam = { version = "0.8", optional = true }
serde_json = { version = "1.0", optional = true }
zuqe_zapi = { path = "../zuqe-zapi", optional = true }
libloading = { version = "0.9", optional = true }

[build-dependencies]
cc = "1.0"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
glob = "0.3"
colorized = "1.0"
libc = "0.2"
clap = { version = "4.5", features = ["derive"] }
anyhow = { version = "1", default-features = false }
env_logger = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.0", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[lib]
path = "src/lib.rs"

[[example]]
name = "zjs"
path = "examples/zjs/main.rs"

[[example]]
name = "persistent"
path = "examples/persistent/main.rs"
required-features = ["persistent"]

[[example]]
name = "test262"
path = "examples/test262/main.rs"
