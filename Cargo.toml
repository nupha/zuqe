[package]
name = "zuqe"
version = "0.7.0"
edition = "2024"
description = "Zuqe JS Engine - A lightweight JS engine implemented in Rust, designed for embedded systems and general‑purpose use."
build = "build.rs"
readme = "README.md"
authors = ["John Ray <996351336@qq.com>"]
repository = "https://github.com/nupha/zuqe"
license = "Apache-2.0"

[features]
all_unicode = ["unicode-xid", "unicode-normalization"]
async_support = []
crossbeam_channel = ["crossbeam"]
serde_json_support = ["serde_json"]

builtin_symbol = []
builtin_proxy = []
builtin_mapset = []
builtin_regexp = ["lre"]
builtin_reflect = []
builtin_json = []
builtin_date = ["libc"]
builtin_math = []

dump_bytecode = []
debug_gc = []

default = [
    "all_unicode",
    "async_support",

    "builtin_symbol",
    "builtin_mapset",
    "builtin_proxy",
    "builtin_regexp",
    "builtin_reflect",
    "builtin_json",
    "builtin_date",
    "builtin_math",
]

[profile.release]
panic = "abort"
overflow-checks = false
debug = false
opt-level = 3
lto = "fat"
strip = "symbols"
codegen-units = 1

[profile.release.package."*"]
overflow-checks = false
debug = false
opt-level = 3
strip = "symbols"

# for flamegraph
[profile.release-with-debug]
inherits = "release"
debug = true
strip = false
[profile.release-with-debug.package."*"]
debug = true
strip = false

[dependencies]
paste = "1.0"
bitflags = "2.0"
once_cell = "1.21"
hash-link = "0.1"
smallvec = "1.13"
fallible_collections = "0.5"
gc-lite = { version = "0.5.1", path="../gc-lite-v2" }
lre = { version = "0.1", optional = true }
libc = { version = "0.2", optional = true }
unicode-xid = { version = "0.2", optional = true }
unicode-normalization = { version = "0.1", optional = true }
zerocopy = "0.8"
log = "0.4"
crossbeam = { version = "0.8", optional = true }
serde_json = { version = "1.0", optional = true }

[build-dependencies]
cc = "1.0"
once_cell = "1.21"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
glob = "0.3"
colorized = "1.0"
libc = "0.2"
clap = { version = "4.5", features = ["derive"] }
anyhow = { version = "1", default-features = false }
env_logger = "0.10"
libloading = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.0", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[lib]
lib = "src/lib.rs"

[[example]]
name = "zjs"
path = "examples/zjs/main.rs"

[[example]]
name = "test262"
path = "examples/test262.rs"
