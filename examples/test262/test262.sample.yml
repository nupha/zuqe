# test262 runner config

# location of the official test262 checkout (must contain test/ and harness/)
base_path: "/path/to/test262"

#log: "./test262.log"

# edition preset to run; must name an entry in `presets:` below.
preset: ES2024

# test scripts whitelist.
# glob paths to select test scripts, empty means all.
tests: []

# test scripts blacklist.
# glob paths to skip entirely (e.g. very slow tests)
exclude_tests: ["annexB/**/*", "staging/**/*"]

# Edition presets. The list is ordered: each preset inherits the features of
# every preset listed before it.
presets:
  - ES5:
      [
        "IsHTMLDDA",
        "host-gc-required",
        "cross-realm",
        "__proto__",
        "__getter__",
        "__setter__",
      ]
  - ES2015:
      [
        "let",
        "const",
        "arrow-function",
        "class",
        "generators",
        "template",
        "for-of",
        "super",
        "new.target",
        "default-parameters",
        "rest-parameters",
        "destructuring-binding",
        "destructuring-assignment",
        "computed-property-names",
        "Symbol",
        "Symbol.iterator",
        "Symbol.hasInstance",
        "Symbol.isConcatSpreadable",
        "Symbol.match",
        "Symbol.replace",
        "Symbol.search",
        "Symbol.species",
        "Symbol.split",
        "Symbol.toPrimitive",
        "Symbol.toStringTag",
        "Symbol.unscopables",
        "Map",
        "Set",
        "WeakMap",
        "WeakSet",
        "Proxy",
        "Reflect",
        "Reflect.construct",
        "Reflect.set",
        "Reflect.setPrototypeOf",
        "Promise",
        "ArrayBuffer",
        "Int8Array",
        "Uint8Array",
        "Uint8ClampedArray",
        "Int16Array",
        "Uint16Array",
        "Int32Array",
        "Uint32Array",
        "Float32Array",
        "Float64Array",
        "TypedArray",
        "DataView",
        "DataView.prototype.getFloat32",
        "DataView.prototype.getFloat64",
        "DataView.prototype.getInt16",
        "DataView.prototype.getInt32",
        "DataView.prototype.getInt8",
        "DataView.prototype.getUint16",
        "DataView.prototype.getUint32",
        "DataView.prototype.setUint8",
        "Array.prototype.values",
        "Object.is",
        "String.fromCodePoint",
        "String.prototype.includes",
        "String.prototype.endsWith",
        "tail-call-optimization",
      ]
  - ES2016: ["Array.prototype.includes", "exponentiation"]
  - ES2017: ["async-functions", "SharedArrayBuffer", "Atomics"]
  - ES2018:
      [
        "async-iteration",
        "object-rest",
        "object-spread",
        "Promise.prototype.finally",
        "regexp-dotall",
        "regexp-lookbehind",
        "regexp-named-groups",
        "regexp-unicode-property-escapes",
        "Symbol.asyncIterator",
      ]
  - ES2019:
      [
        "Array.prototype.flat",
        "Array.prototype.flatMap",
        "Object.fromEntries",
        "json-superset",
        "optional-catch-binding",
        "string-trimming",
        "String.prototype.trimEnd",
        "String.prototype.trimStart",
        "Symbol.prototype.description",
        "stable-array-sort",
        "stable-typedarray-sort",
        "well-formed-json-stringify",
      ]
  - ES2020:
      [
        "BigInt",
        "coalesce-expression",
        "dynamic-import",
        "globalThis",
        "export-star-as-namespace-from-module",
        "import.meta",
        "optional-chaining",
        "Promise.allSettled",
        "String.prototype.matchAll",
        "Symbol.matchAll",
      ]
  - ES2021:
      [
        "AggregateError",
        "FinalizationRegistry",
        "logical-assignment-operators",
        "numeric-separator-literal",
        "Promise.any",
        "String.prototype.replaceAll",
        "WeakRef",
      ]
  - ES2022:
      [
        "arbitrary-module-namespace-names",
        "Array.prototype.at",
        "class-fields-private",
        "class-fields-private-in",
        "class-fields-public",
        "class-methods-private",
        "class-static-block",
        "class-static-fields-private",
        "class-static-fields-public",
        "class-static-methods-private",
        "error-cause",
        "Object.hasOwn",
        "regexp-match-indices",
        "String.prototype.at",
        "top-level-await",
        "TypedArray.prototype.at",
      ]
  - ES2023:
      [
        "array-find-from-last",
        "Atomics.waitAsync",
        "change-array-by-copy",
        "hashbang",
        "String.prototype.isWellFormed",
        "String.prototype.toWellFormed",
        "symbols-as-weakmap-keys",
      ]
  - ES2024:
      [
        "Array.fromAsync",
        "array-grouping",
        "arraybuffer-transfer",
        "Float16Array",
        "promise-with-resolvers",
        "regexp-v-flag",
        "resizable-arraybuffer",
        "set-methods",
        "uint8array-base64",
      ]
  - ES2025:
      [
        "iterator-helpers",
        "json-modules",
        "json-parse-with-source",
        "promise-try",
        "RegExp.escape",
        "regexp-modifiers",
      ]
  - ES2026:
      [
        "Error.isError",
        "iterator-sequencing",
        "joint-iteration",
        "Math.sumPrecise",
      ]

# Features excluded: stage-X proposals or not implemented by zuqe
exclude_features:
  [
    "Temporal",
    "Intl.Era-monthcode",
    "Intl.Locale-info",
    "Intl.NumberFormat-v3",
    "legacy-regexp",
    "source-phase-imports",
    "source-phase-imports-module-source",
    "iterator-chunking",
    "iterator-includes",
    "import-text",
    "decorators",
    "ShadowRealm",
    "immutable-arraybuffer",
    "await-dictionary",
    "import-defer",
    "export-defer",
    "import-bytes",
    "nonextensible-applies-to-private",
    "error-stack-accessor",
  ]
