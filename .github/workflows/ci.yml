# M2b / S4 4.2: the {off,on} x {linux x86_64, linux aarch64, macOS arm64}
# feature-gating matrix. Each row runs the same entry points the maintainer
# runs locally (`tests/jit/ci-gate.sh`, `tests/jit/ci-sanitize.sh`), so a row
# that is green here is exactly what `memo/jit_handover.md` records.
#
# `tests/jit/ci-gate.sh` spells the `off` leg's feature list explicitly because
# D-19 keeps `jit` in `default`; it also asserts cranelift is unreachable with
# the feature off.
name: ci

on:
  push:
  pull_request:

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # linux x86_64, linux aarch64, macOS arm64 (the §4.2 rows).
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: ci-gate
        run: ./tests/jit/ci-gate.sh

  sanitize:
    name: sanitize (ubuntu x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      # The script prints an explicit SKIP while the engine-side ASan blocker
      # (jit_todo 3.1) is open; it still runs the fault-injection leg.
      - name: ci-sanitize
        run: ./tests/jit/ci-sanitize.sh
