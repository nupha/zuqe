# test262 runner config
#
# base_path : location of the official test262 checkout (must contain test/ and harness/)
# log       : optional log file
#
# preset    : edition preset to run. If omitted, the LATEST built-in preset is used.
#             Override on the command line with --preset ES2022.
#             Built-in presets (each extends all previous ones):
#               ES5, ES2015, ES2016, ES2017, ES2018, ES2019,
#               ES2020, ES2021, ES2022, ES2023, ES2024, ES2025, ES2026
#
# tests     : whitelist of globs under test/. If empty or omitted, ALL scripts run.
#             A single test can also be selected on the CLI:
#               cargo run --example test262 -- built-ins/JSON/parse/15.12.1.1-0-3.js
#
# exclude_features : feature blacklist. A test requiring any of these is skipped.
#                    Merged with the built-in proposal blacklist.
#
# exclude_tests    : glob paths to skip entirely (e.g. very slow tests).

base_path: "/Users/johnray/devel/test262"
preset: ES2026
#log: "./test262.log"

# Features excluded: stage-3 proposals and separate specs that are
# not part of any published ECMAScript edition.
exclude_features:
  [
    "Intl.Era-monthcode",
    "Intl.Locale-info",
    "Intl.NumberFormat-v3",
    "legacy-regexp",
    "ShadowRealm",
    "decorators",
    "source-phase-imports",
    "source-phase-imports-module-source",
    "import-defer",
    "export-defer",
    "import-text",
    "immutable-arraybuffer",
    "import-bytes",
    "nonextensible-applies-to-private",
    "await-dictionary",
    "error-stack-accessor",
    "Temporal",
  ]

